name: Release

# Publishes to npm via OIDC Trusted Publishing (no long-lived NPM_TOKEN).
#
# This job is GATED behind the `ENABLE_NPM_PUBLISH` repo variable so pushes don't
# attempt to publish before the package is ready. To enable ongoing tokenless
# releases (one-time):
#   1. Bootstrap the FIRST publish manually — Trusted Publishing cannot create a
#      brand-new package name: `npm publish --access public` (with a temp token/OTP).
#   2. Configure npm Trusted Publishing for @webmaxru/cookieless-insights with this
#      repo + workflow as the trusted publisher (npmjs.com > package > Settings).
#   3. Set the repo variable ENABLE_NPM_PUBLISH=true
#      (`gh variable set ENABLE_NPM_PUBLISH --body true`).
# After that, merging the changesets "Version Packages" PR publishes automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm OIDC trusted publishing

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    # Skipped (green) until publishing is enabled — see the header comment.
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing requires npm >= 11.5.1 (newer than Node 20's bundled npm).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
